<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Marketing-Cockpit</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23e2001a'/%3E%3Ccircle cx='50' cy='50' r='22' fill='none' stroke='white' stroke-width='8'/%3E%3Ccircle cx='73' cy='27' r='6' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" id="brandMark">IG</div>
          <div>
            <strong id="brandName">Marketing-Cockpit</strong>
            <span id="brandSub">Instagram</span>
          </div>
        </div>

        <nav id="nav">
          <button data-view="dashboard" class="active">
            <span class="ico">◉</span> Übersicht
          </button>
          <button data-view="studio"><span class="ico">▣</span> Foto-Studio</button>
          <button data-view="texter"><span class="ico">✎</span> Texter</button>
          <button data-view="plan"><span class="ico">▤</span> Redaktionsplan</button>
          <button data-view="insights"><span class="ico">▲</span> Käufer-Trichter</button>
          <button data-view="settings"><span class="ico">⚙</span> Einstellungen</button>
        </nav>

        <div class="side-status" id="sideStatus"></div>
      </aside>

      <main id="main">
        <div class="loading">Lädt …</div>
      </main>
    </div>

    <div id="toasts" class="toasts"></div>
    <div id="modalRoot"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
